services:
  app:
    image: ${APP_IMAGE:-ghcr.io/fawney19/aether:latest}
    container_name: aether-app
    user: "0:0"
    env_file:
      - ${AETHER_ENV_FILE:-.env}
    environment:
      TZ: Asia/Shanghai
      AETHER_BASE_DIR: /opt/aether
      AETHER_UPDATE_STRATEGY: docker
      AETHER_DOCKER_UPDATE_COMMAND: ${AETHER_DOCKER_UPDATE_COMMAND:-./update.sh}
      AETHER_DATABASE_DRIVER: sqlite
      AETHER_DATABASE_URL: sqlite:///opt/aether/data/aether.db
      AETHER_RUNTIME_BACKEND: memory
      AETHER_GATEWAY_DEPLOYMENT_TOPOLOGY: single-node
      AETHER_GATEWAY_NODE_ROLE: all
      AETHER_GATEWAY_LISTENER_SHARDS: ${AETHER_GATEWAY_LISTENER_SHARDS:-1}
      AETHER_GATEWAY_TOKIO_WORKER_THREADS: ${AETHER_GATEWAY_TOKIO_WORKER_THREADS:-2}
      AETHER_GATEWAY_TOKIO_MAX_BLOCKING_THREADS: ${AETHER_GATEWAY_TOKIO_MAX_BLOCKING_THREADS:-8}
      AETHER_GATEWAY_TOKIO_THREAD_STACK_BYTES: ${AETHER_GATEWAY_TOKIO_THREAD_STACK_BYTES:-2097152}
      AETHER_GATEWAY_REQUEST_CANDIDATE_QUEUE_WORKERS: ${AETHER_GATEWAY_REQUEST_CANDIDATE_QUEUE_WORKERS:-1}
      AETHER_GATEWAY_REQUEST_CANDIDATE_QUEUE_RUNTIME_THREADS: ${AETHER_GATEWAY_REQUEST_CANDIDATE_QUEUE_RUNTIME_THREADS:-1}
      AETHER_GATEWAY_REQUEST_CANDIDATE_QUEUE_CAPACITY: ${AETHER_GATEWAY_REQUEST_CANDIDATE_QUEUE_CAPACITY:-2048}
      AETHER_GATEWAY_MAX_IN_FLIGHT_REQUESTS: ${AETHER_GATEWAY_MAX_IN_FLIGHT_REQUESTS:-128}
      AETHER_GATEWAY_HTTP2_MAX_CONCURRENT_STREAMS: ${AETHER_GATEWAY_HTTP2_MAX_CONCURRENT_STREAMS:-256}
      AETHER_GATEWAY_REQUEST_BODY_BUFFER_BUDGET_MB: ${AETHER_GATEWAY_REQUEST_BODY_BUFFER_BUDGET_MB:-16}
      MALLOC_CONF: ${MALLOC_CONF:-narenas:2,dirty_decay_ms:500,muzzy_decay_ms:500}
      AETHER_LOG_DESTINATION: stdout
      AETHER_LOG_FORMAT: ${AETHER_LOG_FORMAT:-pretty}
      APP_PORT: ${APP_PORT:-8084}
      AETHER_GATEWAY_AUTO_PREPARE_DATABASE: ${AETHER_GATEWAY_AUTO_PREPARE_DATABASE:-true}
    ports:
      - "${APP_PORT:-8084}:${APP_PORT:-8084}"
    volumes:
      - ./data:/opt/aether/data
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    restart: unless-stopped
